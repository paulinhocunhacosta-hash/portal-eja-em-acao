
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ações e Projetos | Portal EJA em Ação</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .pagina-acoes {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .pagina-acoes h2 {
            color: #155e75;
            margin-bottom: 12px;
        }

        .grade-acoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 28px;
        }

        .cartao-acao {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 14px rgba(0,0,0,.08);
            overflow-wrap: anywhere;
        }

        .cartao-acao h3 {
            color: #155e75;
            margin-bottom: 14px;
        }

        .cartao-acao p {
            line-height: 1.6;
            margin: 8px 0;
        }

        .galeria-fotos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 15px;
        }

        .galeria-fotos img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .link-arquivo {
            display: inline-block;
            margin-top: 12px;
            color: #0e7490;
            font-weight: bold;
        }

        .mensagem-vazia {
            background: white;
            padding: 24px;
            margin-top: 25px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #0e7490;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <h1>PORTAL EJA EM AÇÃO</h1>
            <p>Educação, participação e transformação</p>
        </div>
    </header>

    <main class="pagina-acoes">
        <h2>Ações e Projetos</h2>
        <p>Conheça as atividades registradas pelos professores.</p>

        <div id="listaAcoes" class="grade-acoes"></div>

        <p id="estadoVazio" class="mensagem-vazia">
            Carregando ações e projetos...
        </p>

        <a class="voltar" href="index.html">← Voltar à página inicial</a>
    </main>

    <footer>
        <p>© 2026 Portal EJA em Ação</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
    (async function () {

        const lista = document.getElementById("listaAcoes");
        const estadoVazio = document.getElementById("estadoVazio");

        function criarElemento(tag, texto, classe) {
            const elemento = document.createElement(tag);

            if (texto !== undefined && texto !== null) {
                elemento.textContent = texto;
            }

            if (classe) {
                elemento.className = classe;
            }

            return elemento;
        }

        function formatarData(data) {
            if (!data) return "Não informada";

            const partes = data.split("-");

            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }

            return data;
        }

        try {

            // Busca somente as ações aprovadas
            const { data: acoes, error } = await supabaseClient
                .from("acoes")
                .select(`
                    id,
                    titulo,
                    professor,
                    escola,
                    turma,
                    data_acao,
                    descricao,
                    fotos,
                    documento_url
                `)
                .eq("status", "aprovada")
                .order("data_acao", { ascending: false });

            if (error) {
                throw error;
            }

            lista.innerHTML = "";

            const registros = acoes || [];

            if (registros.length === 0) {
                estadoVazio.hidden = false;
                estadoVazio.textContent =
                    "Ainda não há ações aprovadas para publicação.";
                return;
            }

            estadoVazio.hidden = true;

            // Cria um cartão para cada ação aprovada
            for (const acao of registros) {

                const cartao = criarElemento(
                    "article",
                    undefined,
                    "cartao-acao"
                );

                cartao.appendChild(
                    criarElemento("h3", acao.titulo || "Ação sem título")
                );

                cartao.appendChild(
                    criarElemento(
                        "p",
                        "Professor(a): " + (acao.professor || "Não informado")
                    )
                );

                cartao.appendChild(
                    criarElemento(
                        "p",
                        "Escola: " + (acao.escola || "Não informada")
                    )
                );

                if (acao.turma) {
                    cartao.appendChild(
                        criarElemento("p", "Turma: " + acao.turma)
                    );
                }

                cartao.appendChild(
                    criarElemento(
                        "p",
                        "Data: " + formatarData(acao.data_acao)
                    )
                );

                cartao.appendChild(
                    criarElemento("p", acao.descricao || "Sem descrição.")
                );

                // Carrega as fotos do Storage privado
                if (Array.isArray(acao.fotos) && acao.fotos.length > 0) {

                    const galeria = criarElemento(
                        "div",
                        undefined,
                        "galeria-fotos"
                    );

                    const resultadosFotos = await Promise.all(
                        acao.fotos.map(async (caminho) => {

                            if (
                                typeof caminho !== "string" ||
                                !caminho
                            ) {
                                return null;
                            }

                            const { data, error: erroFoto } =
                                await supabaseClient.storage
                                    .from("arquivos")
                                    .createSignedUrl(caminho, 3600);

                            if (erroFoto) {
                                console.error(
                                    "Erro ao carregar foto:",
                                    erroFoto
                                );
                                return null;
                            }

                            return data.signedUrl;
                        })
                    );

                    resultadosFotos.forEach(url => {

                        if (!url) return;

                        const imagem = document.createElement("img");
                        imagem.src = url;
                        imagem.alt = "Foto da ação: " + (acao.titulo || "");
                        imagem.loading = "lazy";

                        galeria.appendChild(imagem);

                    });

                    if (galeria.childElementCount > 0) {
                        cartao.appendChild(galeria);
                    }
                }

                // Carrega o documento PDF, quando existir
                if (acao.documento_url) {

                    const { data, error: erroDocumento } =
                        await supabaseClient.storage
                            .from("arquivos")
                            .createSignedUrl(acao.documento_url, 3600);

                    if (erroDocumento) {
                        console.error(
                            "Erro ao carregar documento:",
                            erroDocumento
                        );
                    } else {

                        const link = document.createElement("a");
                        link.href = data.signedUrl;
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                        link.textContent = "📄 Abrir documento PDF";
                        link.className = "link-arquivo";

                        cartao.appendChild(link);
                    }
                }

                lista.appendChild(cartao);
            }

        } catch (erro) {

            console.error("Erro ao carregar ações:", erro);

            lista.innerHTML = "";
            estadoVazio.hidden = false;
            estadoVazio.textContent =
                "Não foi possível carregar as ações. Tente novamente mais tarde.";

        }

    })();
    </script>

</body>
</html>
