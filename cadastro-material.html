
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Material | Portal EJA em Ação</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<header>
  <h1>PORTAL EJA EM AÇÃO</h1>
  <p>Educação, participação e transformação</p>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="acoes.html">Ações e Projetos</a>
  <a href="materiais.html">Materiais</a>
</nav>

<main class="pagina-acoes">
  <h2>Cadastro de Material Pedagógico</h2>
  <p>
    Professores podem compartilhar materiais pedagógicos com a rede.
    Todos os envios serão avaliados pela administração antes da publicação.
  </p>

  <form id="formularioMaterial">
    <label for="titulo">Título do material:</label>
    <input type="text" id="titulo" name="titulo" maxlength="200" required>

    <label for="categoria">Categoria:</label>
    <select id="categoria" name="categoria" required>
      <option value="">Selecione uma categoria</option>
      <option value="Alfabetização">Alfabetização</option>
      <option value="Língua Portuguesa">Língua Portuguesa</option>
      <option value="Matemática">Matemática</option>
      <option value="Ciências">Ciências</option>
      <option value="História e Geografia">História e Geografia</option>
      <option value="Atividades interdisciplinares">Atividades interdisciplinares</option>
      <option value="Outros">Outros</option>
    </select>

    <label for="descricao">Descrição do material:</label>
    <textarea id="descricao" name="descricao" rows="5" maxlength="10000" required></textarea>

    <label for="documento">Arquivo do material (somente PDF, até 2 MB):</label>
    <input type="file" id="documento" name="documento" accept=".pdf,application/pdf" required>

    <div class="cf-turnstile"
      data-sitekey="0x4AAAAAAFoRspDRFyApHIJD"
      data-theme="light">
    </div>

    <button type="submit" id="botaoEnviar">Enviar material</button>
  </form>

  <div id="resultado" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const formulario = document.getElementById("formularioMaterial");
const resultado = document.getElementById("resultado");
const botao = document.getElementById("botaoEnviar");

formulario.addEventListener("submit", async function(event) {
  event.preventDefault();

  const arquivo = document.getElementById("documento").files[0];

  if (!arquivo) {
    resultado.textContent = "Selecione um arquivo PDF.";
    return;
  }

  if (arquivo.type !== "application/pdf" ||
      !arquivo.name.toLowerCase().endsWith(".pdf")) {
    resultado.textContent = "Envie somente arquivos PDF.";
    return;
  }

  if (arquivo.size > 2 * 1024 * 1024) {
    resultado.textContent = "O arquivo não pode ultrapassar 2 MB.";
    return;
  }

  const captcha = document.querySelector(
    '[name="cf-turnstile-response"]'
  );

  if (!captcha || !captcha.value) {
    resultado.textContent = "Conclua a verificação de segurança.";
    return;
  }

  const dados = new FormData();
  dados.append("titulo", document.getElementById("titulo").value.trim());
  dados.append("categoria", document.getElementById("categoria").value);
  dados.append("descricao", document.getElementById("descricao").value.trim());
  dados.append("documento", arquivo);
  dados.append("cf-turnstile-response", captcha.value);

  botao.disabled = true;
  botao.textContent = "Enviando...";
  resultado.textContent = "";

  try {
    const resposta = await fetch(
      "https://kzdwippnnnpyomgsvpnj.supabase.co/functions/v1/receber-material-eja",
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_PUBLISHABLE_KEY
        },
        body: dados
      }
    );

    const retorno = await resposta.json();

    if (!resposta.ok) {
      throw new Error(retorno.erro || "Não foi possível enviar o material.");
    }

    resultado.textContent =
      "Material enviado com sucesso! Ele ficará aguardando a aprovação da administração.";

    formulario.reset();

    if (window.turnstile) {
      window.turnstile.reset();
    }

  } catch (erro) {
    resultado.textContent = erro.message ||
      "Erro ao enviar. Tente novamente.";
  } finally {
    botao.disabled = false;
    botao.textContent = "Enviar material";
  }
});
</script>

</body>
</html>
