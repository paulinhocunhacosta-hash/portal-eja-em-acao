
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Ações | Portal EJA em Ação</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async defer>
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 25px 15px;
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: 20px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }

    h1 {
      color: #155e75;
      text-align: center;
      font-size: 25px;
    }

    .subtitulo {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 17px 0 7px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    small {
      color: #64748b;
      display: block;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #155e75;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.5;
    }

    .aviso {
      background: #ecfeff;
      border-left: 4px solid #0891b2;
      padding: 12px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #155e75;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>PORTAL EJA EM AÇÃO</h1>

    <p class="subtitulo">
      Cadastro de Ações e Projetos Pedagógicos
    </p>

    <form id="formularioAcao">

      <label for="titulo">Título da ação ou projeto *</label>
      <input type="text" id="titulo" name="titulo"
        maxlength="200" required>

      <label for="professor">Nome do professor responsável *</label>
      <input type="text" id="professor" name="professor"
        maxlength="150" required>

      <label for="escola">Escola *</label>
      <input type="text" id="escola" name="escola"
        maxlength="200" required>

      <label for="turma">Turma</label>
      <input type="text" id="turma" name="turma"
        maxlength="100">

      <label for="data">Data da ação *</label>
      <input type="date" id="data" name="data" required>

      <label for="descricao">Descrição da ação ou projeto *</label>
      <textarea id="descricao" name="descricao"
        maxlength="10000" required></textarea>

      <label for="fotos">Fotos da ação</label>
      <input type="file" id="fotos" name="fotos"
        accept="image/jpeg,image/png,image/webp" multiple>
      <small>Máximo de 10 fotos. Formatos JPG, PNG ou WEBP.</small>

      <label for="documento">Documento em PDF</label>
      <input type="file" id="documento" name="documento"
        accept="application/pdf">
      <small>Envie apenas um documento PDF.</small>

      <div class="aviso">
        <strong>Importante:</strong> seu cadastro será encaminhado
        para análise da administração. A publicação acontecerá
        somente após a aprovação.
      </div>

      <label>Verificação de segurança *</label>

      <div class="cf-turnstile"
        data-sitekey="0x4AAAAAAFoRspDRFyApHIJD">
      </div>

      <button type="submit" id="botaoEnviar">
        Enviar cadastro para aprovação
      </button>

      <div id="resultado" role="status" aria-live="polite"></div>

    </form>

    <a class="voltar" href="index.html">Voltar ao início</a>

  </main>

  <script>
    const ENDPOINT =
      "https://kzdwippnnnpyomgsvpnj.supabase.co/functions/v1/receber-cadastro-eja";

    const CHAVE_PUBLICA =
      "sb_publishable_8UQ_h6SyDMfYYlrmY8OPJw_G6-U-0pK";

    const formulario = document.getElementById("formularioAcao");
    const botao = document.getElementById("botaoEnviar");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", async function(event) {
      event.preventDefault();

      resultado.style.display = "none";

      const fotos = document.getElementById("fotos").files;
      const documento = document.getElementById("documento").files[0];

      if (fotos.length > 10) {
        mostrarMensagem("Envie no máximo 10 fotos.", false);
        return;
      }

      const arquivos = [...fotos];

      if (documento) {
        arquivos.push(documento);
      }

      const tamanhoTotal = arquivos.reduce(
        (total, arquivo) => total + arquivo.size, 0
      );

      if (tamanhoTotal > 2 * 1024 * 1024) {
        mostrarMensagem("O tamanho total dos arquivos não pode ultrapassar 2 MB.", false);
        return;
      }

      for (const foto of fotos) {
        if (!["image/jpeg", "image/png", "image/webp"].includes(foto.type)) {
          mostrarMensagem("Use somente fotos JPG, PNG ou WEBP.", false);
          return;
        }
      }

      if (documento && documento.type !== "application/pdf") {
        mostrarMensagem("O documento deve estar em formato PDF.", false);
        return;
      }

      const token = document.querySelector(
        '[name="cf-turnstile-response"]'
      )?.value;

      if (!token) {
        mostrarMensagem("Conclua a verificação de segurança.", false);
        return;
      }

      const dados = new FormData(formulario);

      botao.disabled = true;
      botao.textContent = "Enviando cadastro...";

      try {
        const resposta = await fetch(ENDPOINT, {
          method: "POST",
          headers: {
            "apikey": CHAVE_PUBLICA
          },
          body: dados
        });

        const retorno = await resposta.json();

        if (!resposta.ok || !retorno.sucesso) {
          throw new Error(retorno.erro || "Não foi possível enviar o cadastro.");
        }

        mostrarMensagem(
          "Cadastro enviado com sucesso! Ele ficará aguardando a aprovação da administração.",
          true
        );

        formulario.reset();

        if (window.turnstile) {
          window.turnstile.reset();
        }

      } catch (erro) {
        mostrarMensagem(
          erro.message || "Erro ao enviar. Tente novamente.",
          false
        );

        if (window.turnstile) {
          window.turnstile.reset();
        }

      } finally {
        botao.disabled = false;
        botao.textContent = "Enviar cadastro para aprovação";
      }
    });

    function mostrarMensagem(mensagem, sucesso) {
      resultado.textContent = mensagem;
      resultado.style.display = "block";
      resultado.style.background = sucesso ? "#dcfce7" : "#fee2e2";
      resultado.style.color = sucesso ? "#166534" : "#991b1b";
    }
  </script>

</body>
</html>
