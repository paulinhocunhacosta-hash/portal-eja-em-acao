<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolas | Portal EJA em Ação</title>
<link rel="stylesheet" href="style.css">

<style>
.pagina-escolas{
max-width:1100px;
margin:40px auto;
padding:20px;
}

.grade-escolas{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:22px;
margin-top:25px;
}

.cartao-escola{
background:#fff;
padding:22px;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
cursor:pointer;
transition:.3s;
}

.cartao-escola:hover{
transform:translateY(-4px);
}

.cartao-escola h3{
color:#155e75;
margin-bottom:10px;
}

.cartao-escola p{
line-height:1.6;
}
</style>
</head>

<body>

<header class="cabecalho">
<div class="logo">
<h1>PORTAL EJA EM AÇÃO</h1>
<p>Educação, participação e transformação</p>
</div>

<nav>
<a href="index.html">Início</a>
<a href="acoes.html">Ações</a>
<a href="materiais.html">Materiais</a>
</nav>
</header>

<main class="pagina-escolas">

<h2>Escolas da Rede Municipal</h2>

<p>Selecione uma escola para visualizar todas as ações aprovadas.</p>

<div id="listaEscolas" class="grade-escolas"></div>

</main>

<footer>
<p>© 2026 Portal EJA em Ação</p>
</footer>


<script>
async function carregarEscolas() {
    const lista = document.getElementById("listaEscolas");

    lista.textContent = "Carregando escolas...";

    const { data, error } = await supabaseClient
        .from("acoes")
        .select("*")
        .eq("status", "aprovada");

    if (error) {
        console.error("Erro ao buscar ações:", error);
        lista.textContent = "Erro ao carregar escolas: " + error.message;
        return;
    }

    console.log("Ações aprovadas encontradas:", data);

    const escolas = [...new Set(
        (data || [])
            .map(item => (item.escola || "").trim().replace(/\.$/, ""))
            .filter(nome => nome !== "")
    )].sort((a, b) => a.localeCompare(b, "pt-BR"));

    lista.innerHTML = "";

    if (escolas.length === 0) {
        lista.textContent = "Ainda não há escolas com ações publicadas.";
        return;
    }

    escolas.forEach(nome => {
        const cartao = document.createElement("div");
        cartao.className = "cartao-escola";

        const titulo = document.createElement("h3");
        titulo.textContent = nome;

        const descricao = document.createElement("p");
        descricao.textContent = "Clique para visualizar as ações desta escola.";

        cartao.appendChild(titulo);
        cartao.appendChild(descricao);

        cartao.addEventListener("click", () => {
            window.location.href =
                "escola.html?nome=" + encodeURIComponent(nome);
        });

        lista.appendChild(cartao);
    });
}

carregarEscolas();
</script>

</body>
</html>
