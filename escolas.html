
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolas | Portal EJA em Ação</title>
<link rel="stylesheet" href="style.css">

<style>
.pagina-escolas{
max-width:1100px;
margin:40px auto;
padding:20px;
}

.grade-escolas{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:22px;
margin-top:25px;
}

.cartao-escola{
background:#fff;
padding:22px;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
cursor:pointer;
transition:.3s;
}

.cartao-escola:hover{
transform:translateY(-4px);
}

.cartao-escola h3{
color:#155e75;
margin-bottom:10px;
}

.cartao-escola p{
line-height:1.6;
}

.mensagem-escolas{
padding:20px;
text-align:center;
line-height:1.6;
}
</style>
</head>

<body>

<header class="cabecalho">
<div class="logo">
<h1>PORTAL EJA EM AÇÃO</h1>
<p>Educação, participação e transformação</p>
</div>

<nav>
<a href="index.html">Início</a>
<a href="acoes.html">Ações</a>
<a href="materiais.html">Materiais</a>
</nav>
</header>

<main class="pagina-escolas">

<h2>Escolas da Rede Municipal</h2>

<p>Selecione uma escola para visualizar todas as ações aprovadas.</p>

<div id="listaEscolas" class="grade-escolas">
<p class="mensagem-escolas">Carregando escolas...</p>
</div>

</main>

<footer>
<p>© 2026 Portal EJA em Ação</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const lista = document.getElementById("listaEscolas");

async function carregarEscolas() {

    lista.innerHTML = `
        <p class="mensagem-escolas">Carregando escolas...</p>
    `;

    try {

        // Busca todas as escolas cadastradas
        const { data: escolas, error: erroEscolas } =
            await supabaseClient
                .from("escolas")
                .select("id, nome")
                .order("nome", { ascending: true });

        if (erroEscolas) {
            throw erroEscolas;
        }

        // Busca somente as ações aprovadas
        const { data: acoes, error: erroAcoes } =
            await supabaseClient
                .from("acoes")
                .select("escola_id")
                .eq("status", "aprovada");

        if (erroAcoes) {
            throw erroAcoes;
        }

        lista.innerHTML = "";

        if (!escolas || escolas.length === 0) {
            lista.innerHTML = `
                <p class="mensagem-escolas">
                    Ainda não há escolas cadastradas.
                </p>
            `;
            return;
        }

        // Cria um cartão para cada escola
        escolas.forEach(escola => {

            // Conta somente as ações aprovadas daquela escola
            const quantidade = (acoes || []).filter(
                acao => acao.escola_id === escola.id
            ).length;

            const cartao = document.createElement("div");
            cartao.className = "cartao-escola";

            const titulo = document.createElement("h3");
            titulo.textContent = escola.nome;

            const descricao = document.createElement("p");

            descricao.textContent =
                quantidade === 1
                    ? "1 ação publicada."
                    : `${quantidade} ações publicadas.`;

            cartao.appendChild(titulo);
            cartao.appendChild(descricao);

            // Abre a página da escola usando seu UUID
            cartao.addEventListener("click", function() {
                window.location.href =
                    "escola.html?id=" + encodeURIComponent(escola.id);
            });

            lista.appendChild(cartao);

        });

    } catch (erro) {

        console.error("Erro ao carregar escolas:", erro);

        lista.innerHTML = `
            <p class="mensagem-escolas">
                Não foi possível carregar as escolas.
                Tente novamente mais tarde.
            </p>
        `;

    }

}

carregarEscolas();
</script>

</body>
</html>
