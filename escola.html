
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ações da Escola | Portal EJA em Ação</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .pagina-escola {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .cabecalho-escola {
            background: #e0f2fe;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .cabecalho-escola h2 {
            color: #155e75;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .grade-acoes-escola {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .cartao-acao-escola {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            overflow-wrap: anywhere;
        }

        .cartao-acao-escola h3 {
            color: #155e75;
            margin-bottom: 12px;
        }

        .cartao-acao-escola p {
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .fotos-acao {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .fotos-acao img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .link-documento {
            display: inline-block;
            margin-top: 10px;
            background: #0e7490;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            text-decoration: none;
        }

        .mensagem-escola {
            background: #f0f9ff;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .voltar-escolas {
            display: inline-block;
            margin-bottom: 20px;
            color: #0e7490;
        }
    </style>
</head>

<body>

<header class="cabecalho">
    <div class="logo">
        <h1>PORTAL EJA EM AÇÃO</h1>
        <p>Educação, participação e transformação</p>
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="acoes.html">Ações e Projetos</a>
        <a href="escolas.html">Escolas</a>
        <a href="materiais.html">Materiais</a>
    </nav>
</header>

<main class="pagina-escola">

    <a class="voltar-escolas" href="escolas.html">← Voltar para as escolas</a>

    <section class="cabecalho-escola">
        <h2 id="nomeEscola">Carregando escola...</h2>
        <p id="resumoEscola">Conheça as experiências desenvolvidas na EJA.</p>
    </section>

    <div id="listaAcoesEscola" class="grade-acoes-escola">
        <p class="mensagem-escola">Carregando ações...</p>
    </div>

</main>

<footer>
    <p>© 2026 Portal EJA em Ação</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
(async function () {

    const parametros = new URLSearchParams(window.location.search);
    const escolaId = parametros.get("id");

    const titulo = document.getElementById("nomeEscola");
    const resumo = document.getElementById("resumoEscola");
    const lista = document.getElementById("listaAcoesEscola");

    function elemento(tag, texto, classe) {
        const el = document.createElement(tag);
        el.textContent = texto;

        if (classe) {
            el.className = classe;
        }

        return el;
    }

    function formatarData(data) {
        if (!data) return "Não informada";

        const partes = data.split("-");

        if (partes.length === 3) {
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        return data;
    }

    // Verifica se uma escola foi selecionada
    if (!escolaId) {
        titulo.textContent = "Escola não selecionada";
        resumo.textContent = "Volte à página de escolas e selecione uma escola.";

        lista.innerHTML = "";
        lista.appendChild(
            elemento("p", "Nenhuma escola foi informada.", "mensagem-escola")
        );

        return;
    }

    try {

        // Busca os dados da escola pelo UUID
        const { data: escola, error: erroEscola } =
            await supabaseClient
                .from("escolas")
                .select("id, nome")
                .eq("id", escolaId)
                .maybeSingle();

        if (erroEscola) {
            throw erroEscola;
        }

        if (!escola) {
            titulo.textContent = "Escola não encontrada";
            resumo.textContent = "Não foi possível localizar esta escola.";

            lista.innerHTML = "";
            lista.appendChild(
                elemento("p", "A escola solicitada não foi encontrada.", "mensagem-escola")
            );

            return;
        }

        titulo.textContent = escola.nome;

        // Busca somente as ações aprovadas da escola selecionada
        const { data: acoes, error: erroAcoes } =
            await supabaseClient
                .from("acoes")
                .select("id, titulo, professor, turma, data_acao, descricao, fotos, documento_url")
                .eq("escola_id", escola.id)
                .eq("status", "aprovada")
                .order("data_acao", { ascending: false });

        if (erroAcoes) {
            throw erroAcoes;
        }

        lista.innerHTML = "";

        const registros = acoes || [];

        resumo.textContent = registros.length === 1
            ? "Esta escola possui 1 ação publicada."
            : `Esta escola possui ${registros.length} ações publicadas.`;

        if (registros.length === 0) {
            lista.appendChild(
                elemento(
                    "p",
                    "Não há ações aprovadas para esta escola no momento.",
                    "mensagem-escola"
                )
            );

            return;
        }

        // Cria os cartões das ações
        for (const acao of registros) {

            const cartao = document.createElement("article");
            cartao.className = "cartao-acao-escola";

            cartao.appendChild(
                elemento("h3", acao.titulo || "Ação sem título")
            );

            cartao.appendChild(
                elemento("p", "Professor(a): " + (acao.professor || "Não informado"))
            );

            if (acao.turma) {
                cartao.appendChild(
                    elemento("p", "Turma: " + acao.turma)
                );
            }

            cartao.appendChild(
                elemento("p", "Data: " + formatarData(acao.data_acao))
            );

            cartao.appendChild(
                elemento("p", acao.descricao || "Sem descrição.")
            );

            // Carrega as fotos privadas usando URLs temporárias
            if (Array.isArray(acao.fotos) && acao.fotos.length > 0) {

                const galeria = document.createElement("div");
                galeria.className = "fotos-acao";

                const resultadosFotos = await Promise.all(
                    acao.fotos.map(async (caminho) => {

                        if (typeof caminho !== "string" || !caminho) {
                            return null;
                        }

                        const { data, error } =
                            await supabaseClient.storage
                                .from("arquivos")
                                .createSignedUrl(caminho, 3600);

                        if (error) {
                            console.error("Erro ao carregar foto:", error);
                            return null;
                        }

                        return data.signedUrl;
                    })
                );

                resultadosFotos.forEach(url => {

                    if (!url) return;

                    const imagem = document.createElement("img");
                    imagem.src = url;
                    imagem.alt = "Foto da ação pedagógica";
                    imagem.loading = "lazy";

                    galeria.appendChild(imagem);

                });

                if (galeria.childElementCount > 0) {
                    cartao.appendChild(galeria);
                }
            }

            // Carrega o documento PDF, quando existir
            if (acao.documento_url) {

                const { data, error } =
                    await supabaseClient.storage
                        .from("arquivos")
                        .createSignedUrl(acao.documento_url, 3600);

                if (error) {
                    console.error("Erro ao carregar documento:", error);
                } else {

                    const link = document.createElement("a");
                    link.className = "link-documento";
                    link.href = data.signedUrl;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "Abrir documento PDF";

                    cartao.appendChild(link);
                }
            }

            lista.appendChild(cartao);

        }

    } catch (erro) {

        console.error("Erro ao carregar página da escola:", erro);

        titulo.textContent = "Não foi possível carregar a escola";
        resumo.textContent = "Ocorreu um problema ao consultar os dados.";

        lista.innerHTML = "";
        lista.appendChild(
            elemento(
                "p",
                "Não foi possível carregar as ações desta escola. Tente novamente mais tarde.",
                "mensagem-escola"
            )
        );

    }

})();
</script>

</body>
</html>
